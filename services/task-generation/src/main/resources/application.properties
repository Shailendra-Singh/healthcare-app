# --- Database: task_generation, in this service's own PostgreSQL (localhost:5434 in dev) ---
quarkus.datasource.db-kind=postgresql
%dev,prod.quarkus.datasource.username=${TASK_DB_USER}
%dev,prod.quarkus.datasource.password=${TASK_DB_PASSWORD}
%dev,prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_HOST_PORT:5434}/${TASK_DB_NAME:task_generation}

# --- Flyway / Hibernate ---
quarkus.flyway.migrate-at-start=true
# Flyway owns the schema; Hibernate only checks at startup that the entities match it
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.jdbc.statement-batch-size=200

# --- Task generation ---
# How often to check the rules-engine for a newer successful evaluation to reconcile against
task-generation.poll-every=${TASK_POLL_EVERY:5m}
task-generation.startup-delay=20s
# Care needs read from the rules-engine per request
task-generation.page-size=500

# --- rules-engine API ---
quarkus.rest-client.rules-engine.url=${RULES_ENGINE_URL:http://localhost:8082}
quarkus.rest-client.rules-engine.read-timeout=120000

# --- REST API ---
quarkus.rest.path=/api/v1
# Local ports: clinical-data 8081, rules-engine 8082, task-generation 8083 (in containers all listen on 8080)
%dev.quarkus.http.port=8083

# --- OpenAPI / Swagger UI ---
# UI: /q/swagger-ui   Spec: /q/openapi
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Task Generation API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Scheduling and referral tasks generated from the rules-engine's care needs, and worked by people.

# --- Tests ---
# The connection settings above apply only to dev and prod, so tests get a throwaway PostgreSQL
# container from Dev Services (needs Docker or Podman). No scheduled checks in tests.
%test.quarkus.datasource.devservices.image-name=docker.io/library/postgres:18
%test.quarkus.scheduler.enabled=false
# A random free port, so tests don't clash with a service running in dev mode
quarkus.http.test-port=0
