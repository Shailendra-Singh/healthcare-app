# The public entry point: routes /{service}/api/** to clinical-data, rules-engine and task-generation after checking
# the caller's Keycloak roles, and serves one Swagger UI with a dropdown for every service's API.

# --- Keycloak (OIDC) ---
# Browsers log in through the gateway (session cookie); Swagger UI and API clients send bearer tokens
quarkus.oidc.application-type=hybrid
%dev,prod.quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8180}/realms/healthcare
quarkus.oidc.client-id=api-gateway
%dev,prod.quarkus.oidc.credentials.secret=${GATEWAY_CLIENT_SECRET}
# Only tokens issued for the gateway
quarkus.oidc.token.audience=api-gateway
quarkus.oidc.roles.role-claim-path=realm_access/roles
# Keycloak puts realm roles in the access token only; browser logins would otherwise read the ID token (no roles)
quarkus.oidc.roles.source=accesstoken
# JavaScript calls without a session get 499 instead of a redirect to the login page
quarkus.oidc.authentication.java-script-auto-redirect=false
quarkus.oidc.authentication.restore-path-after-redirect=true
# Sessions renew their tokens instead of ending when the (5 minute) access token expires
quarkus.oidc.token.refresh-expired=true
quarkus.oidc.logout.path=/logout
# Back to the frontend's login page (the frontend's nginx passes /logout through to the gateway)
quarkus.oidc.logout.post-logout-path=/
# Keycloak runs as its own stack; no Dev Services container
quarkus.keycloak.devservices.enabled=false

# --- Routes ---
gateway.services.clinical-data.url=${CLINICAL_DATA_URL:http://localhost:8081}
gateway.services.rules-engine.url=${RULES_ENGINE_URL:http://localhost:8082}
gateway.services.task-generation.url=${TASK_GENERATION_URL:http://localhost:8083}

# --- Task types per role (admin sees every type) ---
gateway.task-access.scheduler=SCHEDULING
gateway.task-access.clinical-team=SCHEDULING,REFERRAL

# --- Swagger UI: one page, a dropdown per service; Authorize logs in through Keycloak ---
# UI: /q/swagger-ui
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.urls.api-gateway=/q/openapi
quarkus.swagger-ui.urls.clinical-data=/openapi/clinical-data
quarkus.swagger-ui.urls.rules-engine=/openapi/rules-engine
quarkus.swagger-ui.urls.task-generation=/openapi/task-generation
quarkus.swagger-ui.urls-primary-name=task-generation
quarkus.swagger-ui.oauth-client-id=api-gateway-swagger
quarkus.swagger-ui.oauth-use-pkce-with-authorization-code-grant=true
quarkus.swagger-ui.oauth-scopes=openid
quarkus.swagger-ui.persist-authorization=true
# The realm as browsers reach it (Swagger UI's login and token URLs)
gateway.keycloak.public-realm-url=${KEYCLOAK_PUBLIC_URL:http://localhost:8180}/realms/healthcare
quarkus.smallrye-openapi.info-title=API Gateway
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Role-based entry point to clinical-data, rules-engine and task-generation. Pick a service in the dropdown above.
mp.openapi.filter=me.shail.openapi.GatewayOpenApiFilter

# --- Tests ---
# Tests run as users with given roles (@TestSecurity) and mock the downstream services; no Keycloak
%test.quarkus.oidc.tenant-enabled=false
quarkus.http.test-port=0
