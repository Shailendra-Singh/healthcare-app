quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER}
quarkus.datasource.password=${POSTGRES_PASSWORD}
# Blocking (Flyway)
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST}:${DB_HOST_PORT:5432}/${DB_NAME}
# Non-blocking (App Logic)
quarkus.datasource.reactive.url=postgresql://${DB_HOST}:${DB_HOST_PORT:5432}/${DB_NAME}
quarkus.datasource.reactive.max-size=20

# --- Flyway Configuration ---
quarkus.flyway.migrate-at-start=true

# --- Hibernate ---
# Flyway owns the schema; Hibernate only checks at startup that the entities match it
quarkus.hibernate-orm.schema-management.strategy=validate
%dev.quarkus.hibernate-orm.log.sql=true
