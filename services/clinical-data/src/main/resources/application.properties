quarkus.datasource.db-kind=postgresql
%dev,prod.quarkus.datasource.username=${POSTGRES_USER}
%dev,prod.quarkus.datasource.password=${POSTGRES_PASSWORD}
# Blocking (Flyway)
%dev,prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_HOST_PORT:5432}/${DB_NAME}
# Non-blocking (App Logic)
%dev,prod.quarkus.datasource.reactive.url=postgresql://${DB_HOST:localhost}:${DB_HOST_PORT:5432}/${DB_NAME}
quarkus.datasource.reactive.max-size=20

# --- Flyway Configuration ---
quarkus.flyway.migrate-at-start=true

# --- Hibernate ---
# Flyway owns the schema; Hibernate only checks at startup that the entities match it
quarkus.hibernate-orm.schema-management.strategy=validate
%dev.quarkus.hibernate-orm.log.sql=true

# --- REST API ---
quarkus.rest.path=/api/v1
# Local ports: clinical-data 8081, rules-engine 8082 (in containers both listen on 8080)
%dev.quarkus.http.port=8081

# --- Read-only API ---
# The app's reactive pool opens every PostgreSQL session read-only, so any INSERT/UPDATE/DELETE
# from the app fails in the database. Flyway uses the separate JDBC connection and is unaffected.
quarkus.datasource.reactive.additional-properties.default_transaction_read_only=on

# --- Tests ---
# Tests never use the .env database: the connection settings above apply only to dev and prod,
# so Dev Services starts a throwaway PostgreSQL container for tests (needs Docker or Podman).
%test.quarkus.datasource.devservices.image-name=docker.io/library/postgres:18
# A random free port, so tests don't clash with a service running in dev mode
quarkus.http.test-port=0

# --- OpenAPI / Swagger UI ---
# Swagger UI is on by default only in dev and test; always-include also serves it from the packaged app.
# UI: /q/swagger-ui   Spec: /q/openapi
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Clinical Data API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Read-only access to patients, diagnoses, lab results and encounters loaded by the clinical data ETL.
