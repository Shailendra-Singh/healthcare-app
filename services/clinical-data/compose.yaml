# clinical-data stack: PostgreSQL 18, the Quarkus app and the CSV ETL, on clinical-data-network.
# (The rules-engine has its own stack in ../rules-engine and joins this network to call the API.)
#
# Build the app first (the image copies target/quarkus-app), then start everything:
#
#   ./mvnw package -DskipTests
#   docker compose up --build        # or: podman compose up --build
#
# POSTGRES_USER, POSTGRES_PASSWORD and DB_NAME come from .env next to this file,
# which Compose reads automatically for ${...} substitution.

name: clinical-data

services:
  postgres:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker, so mount the parent
      - ./.data:/var/lib/postgresql
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - clinical-data-network

  clinical-data:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    image: clinical-data:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${DB_NAME}
      # Inside the network the database is reached by service name on its container port
      DB_HOST: postgres
      DB_HOST_PORT: "5432"
    ports:
      - "8081:8080"   # clinical-data at localhost:8081
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - clinical-data-network

  # Loads the four CSVs from the repo's data/ folder whenever their checksums change
  etl:
    build: ./etl
    image: clinical-data-etl:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: postgres
      DB_HOST_PORT: "5432"
      DATA_DIR: /data
      ETL_INTERVAL_SECONDS: ${ETL_INTERVAL_SECONDS:-300}
      ETL_FILE_SETTLE_SECONDS: ${ETL_FILE_SETTLE_SECONDS:-30}
    volumes:
      - ../../data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      # The app's Flyway migrations create the tables; the ETL waits for them if needed
      clinical-data:
        condition: service_started
    restart: unless-stopped
    networks:
      - clinical-data-network

networks:
  clinical-data-network:
    name: clinical-data-network
