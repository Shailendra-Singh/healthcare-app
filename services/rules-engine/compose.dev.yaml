# Local development only: publishes this stack's ports on your machine, for dev mode (./mvnw quarkus:dev
# against the container database), psql, and calling the API directly without the api-gateway.
#
#   podman compose -f compose.yaml -f compose.dev.yaml up -d            # the whole stack
#   podman compose -f compose.yaml -f compose.dev.yaml up -d rules-engine-db    # just the database
#
# Without this file, the API is reachable only through the api-gateway and the database only from this stack.

services:
  rules-engine-db:
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
  rules-engine:
    ports:
      - "8082:8080"   # rules-engine at localhost:8082
