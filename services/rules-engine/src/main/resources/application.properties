# --- Database: rules_engine, in this service's own PostgreSQL (localhost:5433 in dev) ---
quarkus.datasource.db-kind=postgresql
%dev,prod.quarkus.datasource.username=${RULES_DB_USER}
%dev,prod.quarkus.datasource.password=${RULES_DB_PASSWORD}
%dev,prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST}:${DB_HOST_PORT:5433}/${RULES_DB_NAME:rules_engine}

# --- Flyway / Hibernate ---
quarkus.flyway.migrate-at-start=true
# Flyway owns the schema; Hibernate only checks at startup that the entities match it
quarkus.hibernate-orm.schema-management.strategy=validate
# Results are inserted a page at a time
quarkus.hibernate-orm.jdbc.statement-batch-size=200
# JSON columns (patient_program.evidence) use Hibernate's own Jackson mapper, not the REST one
quarkus.hibernate-orm.mapping.format.global=ignore

# --- Care programs ---
# The folder of program YAML files; re-read at the start of every evaluation
rules-engine.programs-dir=${CARE_PROGRAMS_DIR:../../care-programs}

# --- Evaluation ---
# Daily at 06:00 by default (Quartz cron: sec min hour day month weekday)
rules-engine.evaluation.cron=${EVALUATION_CRON:0 0 6 * * ?}
# On startup, evaluate if there is no successful run for today yet
rules-engine.evaluation.run-on-startup=true
rules-engine.evaluation.startup-delay=20s
# How often to check clinical-data for a new successful ETL load, which triggers a re-evaluation
rules-engine.evaluation.etl-check-every=${ETL_CHECK_EVERY:1m}
# Patients fetched from clinical-data per request
rules-engine.evaluation.page-size=500
# Older runs (and their results) are deleted after each successful run
rules-engine.evaluation.keep-runs=30

# --- clinical-data API ---
quarkus.rest-client.clinical-data.url=${CLINICAL_DATA_URL:http://localhost:8081}
quarkus.rest-client.clinical-data.read-timeout=120000

# --- REST API ---
quarkus.rest.path=/api/v1
# Local ports: clinical-data 8081, rules-engine 8082 (in containers both listen on 8080)
%dev.quarkus.http.port=8082

# --- OpenAPI / Swagger UI ---
# UI: /q/swagger-ui   Spec: /q/openapi
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Rules Engine API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Care program membership, tiers and care needs, evaluated daily from clinical-data.

# --- Tests ---
# The connection settings above apply only to dev and prod, so tests get a throwaway PostgreSQL
# container from Dev Services (needs Docker or Podman). No scheduled or startup runs in tests.
%test.quarkus.datasource.devservices.image-name=docker.io/library/postgres:18
%test.quarkus.scheduler.enabled=false
%test.rules-engine.evaluation.run-on-startup=false
# A random free port, so tests don't clash with a service running in dev mode
quarkus.http.test-port=0
