# rules-engine stack: the app and its own PostgreSQL 18 on rules-engine-network.
#
# rules-engine also joins clinical-data-network, only to call the clinical-data API, so start the
# clinical-data stack first (it creates that network). Build the app first (the image copies
# target/quarkus-app), then start:
#
#   ./mvnw package -DskipTests
#   docker compose up --build        # or: podman compose up --build
#
# RULES_DB_USER and RULES_DB_PASSWORD come from .env next to this file, which Compose reads
# automatically for ${...} substitution.

name: rules-engine

services:
  # Named rules-engine-db, not postgres: rules-engine is also on clinical-data-network, where
  # "postgres" is clinical-data's database
  rules-engine-db:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_USER: ${RULES_DB_USER:?set RULES_DB_USER in .env}
      POSTGRES_PASSWORD: ${RULES_DB_PASSWORD:?set RULES_DB_PASSWORD in .env}
      POSTGRES_DB: ${RULES_DB_NAME:-rules_engine}
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker, so mount the parent
      - ./.data:/var/lib/postgresql
    ports:
      # clinical-data's database has 5432
      - "${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - rules-engine-network

  # Evaluates every patient against the care programs daily
  rules-engine:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    image: rules-engine:latest
    environment:
      RULES_DB_USER: ${RULES_DB_USER}
      RULES_DB_PASSWORD: ${RULES_DB_PASSWORD}
      RULES_DB_NAME: ${RULES_DB_NAME:-rules_engine}
      DB_HOST: rules-engine-db
      DB_HOST_PORT: "5432"
      CLINICAL_DATA_URL: http://clinical-data:8080
      CARE_PROGRAMS_DIR: /care-programs
      EVALUATION_CRON: ${EVALUATION_CRON:-0 0 6 * * ?}
      # "Today" for ages, lab windows and due dates follows this time zone
      TZ: ${TZ:-UTC}
    volumes:
      - ../../care-programs:/care-programs:ro
    ports:
      - "8082:8080"   # rules-engine at localhost:8082
    depends_on:
      rules-engine-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rules-engine-network
      - clinical-data-network

networks:
  rules-engine-network:
    name: rules-engine-network
  # Created by the clinical-data stack
  clinical-data-network:
    name: clinical-data-network
    external: true
