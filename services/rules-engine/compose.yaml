# rules-engine stack: the app and its own PostgreSQL 18 on the private rules-engine-network.
#
# Only the app joins the API networks: clinical-data-api-network to call clinical-data (start that stack
# first, it creates the network) and rules-engine-api-network, which consumers (task-generation) join to call
# this API. The database is reachable from this stack only. Build the app first (the image copies
# target/quarkus-app), then start:
#
#   ./mvnw package -DskipTests
#   docker compose up --build        # or: podman compose up --build
#
# Nothing is published on your machine: the API is reached through the api-gateway. For local development add
# compose.dev.yaml, which publishes the ports: podman compose -f compose.yaml -f compose.dev.yaml up -d
#
# RULES_DB_USER and RULES_DB_PASSWORD come from .env next to this file, which Compose reads
# automatically for ${...} substitution.

name: rules-engine

services:
  rules-engine-db:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_USER: ${RULES_DB_USER:?set RULES_DB_USER in .env}
      POSTGRES_PASSWORD: ${RULES_DB_PASSWORD:?set RULES_DB_PASSWORD in .env}
      POSTGRES_DB: ${RULES_DB_NAME:-rules_engine}
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker, so mount the parent
      - ./.data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - rules-engine-network

  # Evaluates every patient against the care programs daily
  rules-engine:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    image: rules-engine:latest
    environment:
      RULES_DB_USER: ${RULES_DB_USER}
      RULES_DB_PASSWORD: ${RULES_DB_PASSWORD}
      RULES_DB_NAME: ${RULES_DB_NAME:-rules_engine}
      DB_HOST: rules-engine-db
      DB_HOST_PORT: "5432"
      CLINICAL_DATA_URL: http://clinical-data:8080
      CARE_PROGRAMS_DIR: /care-programs
      EVALUATION_CRON: ${EVALUATION_CRON:-0 0 6 * * ?}
      # "Today" for ages, lab windows and due dates follows this time zone
      TZ: ${TZ:-UTC}
    volumes:
      - ../../care-programs:/care-programs:ro
    depends_on:
      rules-engine-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rules-engine-network
      - rules-engine-api-network
      - clinical-data-api-network

networks:
  # Private: this stack only
  rules-engine-network:
    name: rules-engine-network
  # This API, for consumers; only the app joins it here
  rules-engine-api-network:
    name: rules-engine-api-network
  # clinical-data's API, created by the clinical-data stack
  clinical-data-api-network:
    name: clinical-data-api-network
    external: true
