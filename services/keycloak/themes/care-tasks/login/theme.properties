# Care Tasks login pages: Keycloak's own login theme (keycloak.v2) with the app's logo, colours and font.
# Only the styling changes; every page and flow (password reset, OTP, errors) comes from the parent.
parent=keycloak.v2
import=common/keycloak

# The parent's stylesheet first, then ours on top
styles=css/styles.css css/care-tasks.css

meta=theme-color==#0172ad
